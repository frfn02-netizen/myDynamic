  <rect x="88" y="121" width="88" height="7" rx="3.5" fill="#f4f6ff" fill-opacity="0.95"/>
  <rect x="88" y="136" width="58" height="5" rx="2.5" fill="#aab5c8" fill-opacity="0.75"/>
  <rect x="190" y="118" width="32" height="20" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12"/>
