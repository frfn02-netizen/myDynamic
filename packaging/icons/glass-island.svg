  </defs>
  <rect x="16" y="88" width="224" height="80" rx="40" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.18"/>
  <rect x="18" y="90" width="220" height="76" rx="38" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="48" y="90" width="160" height="2" rx="1" fill="url(#shine)"/>
