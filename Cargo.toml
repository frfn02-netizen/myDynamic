[package]
name = "glass-island"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A native KDE Wayland Liquid Glass desktop island"
readme = "README.md"
keywords = ["wayland", "kde", "slint", "layer-shell", "desktop"]
categories = ["gui"]

[dependencies]
slint = {
    version = "1.18",
    default-features = false,
    features = [
        "std",
        "compat-1-18",
        "renderer-software",
    ],
}

calloop = { version = "0.13", features = ["signals"] }
calloop-wayland-source = "0.3"
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
bytemuck = { version = "1", features = ["derive"] }

zbus = "6.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pulseaudio = "0.3"
futures-lite = "2"
async-io = "2.6"

tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
